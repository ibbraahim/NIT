; Copiez ce fichier en config.ini puis adaptez les valeurs.
[base_de_donnees]
hote = localhost
port = 5432
base = planification_233
utilisateur = planif_app
mot_de_passe = a_modifier
; Base d'administration utilisée pour créer la base (python -m app.bd.init_bd)
base_administration = postgres
pool_min = 1
pool_max = 8

[application]
devise = MAD
; Niveau du journal : DEBUG, INFO, WARNING, ERROR
niveau_journal = INFO
