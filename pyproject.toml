[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests nécessitant une base PostgreSQL de test",
    "gui: tests nécessitant un affichage (xvfb-run sous Linux)",
]
