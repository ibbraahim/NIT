name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: planif_app
          POSTGRES_PASSWORD: planif_test
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U planif_app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Tkinter et un serveur X virtuel
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

      - name: Installer les dépendances Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Générer config.ini pour la base de test
        run: |
          cp config.exemple.ini config.ini
          sed -i "s/mot_de_passe = a_modifier/mot_de_passe = planif_test/" config.ini

      - name: Vérifier le format (black)
        run: black --check .

      - name: Vérifier le style (ruff)
        run: ruff check .

      - name: Exécuter la suite de tests (pytest, sous affichage virtuel)
        run: xvfb-run -a python -m pytest
